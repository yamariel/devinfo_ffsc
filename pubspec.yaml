name: devinfo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: 0.15.6
  intl: ^0.20.3
  rename_app: ^1.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    -  assets/images/
    -  assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

config_name:
  name: "Dev Info"

flutter_native_splash:
  color: "#4F46E5"
  image: assets/images/splash.png

  fullscreen: true
  #! ANDROID 12+ configuration:
  android_12:
    color: "#4F46E5"
    image: assets/images/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/logo.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#0F172A"
    theme_color: "#4F46E5"
